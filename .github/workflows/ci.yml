name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: core has no third-party requirements
        run: ./.github/scripts/check-core-deps.sh
      - name: fiber stays out of the core, gin and plugin graphs
        run: ./.github/scripts/check-no-fiber.sh . adapters/ginprblm mappers/gormmap mappers/pgxmap mappers/validatormap
      - name: test-only drivers stay out of plugin code
        run: |
          ./.github/scripts/check-test-only-deps.sh mappers/gormmap gorm.io/driver/sqlite github.com/mattn/go-sqlite3
          ./.github/scripts/check-test-only-deps.sh mappers/validatormap github.com/go-playground/locales/en github.com/go-playground/locales/id

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., adapters/ginprblm, adapters/fiberprblm, internal/paritytest, internal/plugintest, mappers/gormmap, mappers/pgxmap, mappers/validatormap]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: go.mod is tidy
        run: GOWORK=off go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: vet (other platforms)
        # Platform-specific code (syscall errors) must build everywhere.
        if: matrix.module == '.'
        run: |
          for target in windows/amd64 darwin/arm64 js/wasm wasip1/wasm plan9/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
          done
      - name: test (workspace, race)
        run: go test -race ./...
      - name: test (module only)
        run: GOWORK=off go test ./...
      - name: test (GOEXPERIMENT=nojsonv2)
        # Go 1.27 still lets a build opt out of the encoding/json v2
        # implementation. The core must behave the same under both: the XML
        # encoder writes strings directly because both replace invalid UTF-8
        # as the XML encoder does.
        if: matrix.module == '.'
        run: GOEXPERIMENT=nojsonv2 go test ./...
      - name: benchmarks (smoke, once each)
        # Each benchmark runs once, so it keeps compiling, its pre-loop
        # checks pass and it doesn't panic. Shared runners are too noisy to
        # time anything: no timings are published and nothing is gated on
        # speed (BENCHMARKS.md has the measurement protocol).
        if: contains(fromJSON('[".", "adapters/ginprblm", "adapters/fiberprblm"]'), matrix.module)
        run: go test -run '^$' -bench . -benchtime 1x ./...
      - name: benchmarks (smoke, once each, module only)
        # The published adapter numbers are measured with GOWORK=off, so
        # that configuration must keep running too. It runs against the
        # core each go.mod resolves: the released core it requires, or,
        # while go.mod replaces the core with ../.. (an adapter that needs
        # an unreleased core), the core in the repository.
        if: contains(fromJSON('["adapters/ginprblm", "adapters/fiberprblm"]'), matrix.module)
        run: GOWORK=off go test -run '^$' -bench . -benchtime 1x ./...

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., adapters/ginprblm, adapters/fiberprblm, internal/paritytest, internal/plugintest, mappers/gormmap, mappers/pgxmap, mappers/validatormap]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
